name: Morning Brief

on:
  schedule:
    # GitHub starts scheduled runs late (or drops them): on 1 Oct 2026 the 04:50 and 05:20 slots did not
    # fire and the first run started at 11:11 UTC. So there are several slots (06:50 to 07:50 SAST);
    # each one does nothing if an earlier run already sent today's brief (data/last_sent.txt).
    - cron: "50 4 * * *"
    - cron: "5 5 * * *"
    - cron: "20 5 * * *"
    - cron: "35 5 * * *"
    - cron: "50 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print the message in the log instead of sending it to Telegram (nothing is saved or committed)"
        type: boolean
        default: false

permissions:
  contents: write   # only used to commit files under data/ after a real run

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - id: install
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install -r requirements.txt
          # The optional headline summary needs the Anthropic SDK; only install it if you set the secret.
          if [ -n "$ANTHROPIC_API_KEY" ]; then pip install -r requirements-llm.txt; fi
      - name: Build and send the brief
        id: brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional; only used if [summary] enabled
          LOG_LEVEL: ${{ inputs.dry_run && 'DEBUG' || 'INFO' }}
        run: python -m jobs.morning_brief ${{ inputs.dry_run && '--dry-run' || '' }} ${{ github.event_name == 'schedule' && '--skip-if-sent-today' || '' }}
      # Keeps today's YouTube numbers (tomorrow's change) and the 'sent today' marker. Skipped on dry runs.
      # Runs even if the Telegram step failed: the snapshot is still valid data.
      - name: Commit YouTube history
        id: commit
        if: ${{ !cancelled() && inputs.dry_run != true }}
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: daily state $(date -u +%F)"
            git push || { git pull --rebase && git push; }
          else
            echo "No history changes to commit."
          fi
      # Last resort: if the job broke before the script could send anything (dependency install,
      # Python crash), tell Telegram so a missing brief isn't a silent surprise. Skipped when only
      # the history commit failed (the brief was already sent) and on dry runs.
      - name: Alert on failure
        if: ${{ failure() && steps.commit.outcome != 'failure' && inputs.dry_run != true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Morning brief failed to run. Details: ${RUN_URL}" \
            > /dev/null || true
