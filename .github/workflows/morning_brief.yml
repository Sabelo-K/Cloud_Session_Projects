name: Morning Brief

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 07:00 SAST. GitHub may start scheduled runs a few minutes late.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print the message in the log instead of sending it to Telegram (nothing is saved or committed)"
        type: boolean
        default: false

permissions:
  contents: write   # only used to commit data/youtube_history.json after a real run

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and send the brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LOG_LEVEL: ${{ inputs.dry_run && 'DEBUG' || 'INFO' }}
        run: python -m jobs.morning_brief ${{ inputs.dry_run && '--dry-run' || '' }}
      # Keeps today's YouTube numbers so tomorrow's brief can show the change. Skipped on dry runs.
      # Runs even if the Telegram step failed: the snapshot is still valid data.
      - name: Commit YouTube history
        if: ${{ !cancelled() && inputs.dry_run != true }}
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: YouTube stats snapshot $(date -u +%F)"
            git push
          else
            echo "No history changes to commit."
          fi
