name: Save F1 data

# Saves every finished race weekend of the season that is not in f1/store yet (race and qualifying) and pushes it, so the
# hosted Streamlit app updates by itself. Safe to run any time: when nothing is missing it does nothing.
# If F1's server refuses GitHub's servers (as it does Streamlit Cloud) the run fails; use the scheduled task
# described in the README instead.
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      year:
        description: "Season to save (default: the current year)"
        required: false
        default: ""

permissions:
  contents: write   # commits files under f1/store/

concurrency:
  group: f1-data
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: f1/requirements.txt
      - run: pip install -r f1/requirements.txt
      - name: Save missing sessions
        env:
          YEAR: ${{ inputs.year }}
        run: python -m f1.sync --year "${YEAR:-$(date -u +%Y)}" --missing
      - name: Commit and push
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$(git status --porcelain f1/store/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add f1/store/
            git commit -m "Save F1 data $(date -u +%F)"
            git push || { git pull --rebase && git push; }
          else
            echo "Nothing new to commit."
          fi
