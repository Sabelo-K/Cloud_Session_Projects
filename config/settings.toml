# SA Morning Brief settings. Edit freely; every section is optional via `enabled`.

[brief]
# Soft cap on message length. If the message is longer, blank separator lines are dropped.
max_lines = 30
# A section that takes longer than this is abandoned (shown as unavailable) so the message still
# goes out on time.
section_timeout_seconds = 120

[weather]
enabled = true
name = "Durban"
latitude = -29.86
longitude = 31.03
timezone = "Africa/Johannesburg"
base_url = "https://api.open-meteo.com/v1/forecast"   # Open-Meteo, no API key

[fx]
enabled = true
# Frankfurter serves ECB reference rates, published once per business day (~16:00 CET).
# If this host ever moves, the older https://api.frankfurter.app is the same service.
base_url = "https://api.frankfurter.dev/v1"
quote = "ZAR"
bases = ["USD", "EUR", "GBP"]   # shown as USD/ZAR, EUR/ZAR, GBP/ZAR

[markets]
# OFF: replaced by [ai_news] below. Set to true to bring the JSE/Brent/gold block back.
enabled = false
# Extra dates (YYYY-MM-DD) the JSE was closed that the `holidays` package doesn't know about,
# e.g. a one-off declared holiday. Weekends and ZA public holidays are already handled.
extra_jse_closed_dates = []
# Yahoo usually fails all-or-nothing, so after this many failures in a row the remaining tickers
# are skipped, and the section never spends longer than the budget.
max_consecutive_failures = 3
budget_seconds = 60

# market = "JSE"  -> uses the JSE session calendar (weekdays minus ZA public holidays)
# market = "24H"  -> futures; weekdays only
# divisor = 100   -> Yahoo quotes JSE equities in cents (ZAc); this shows Rand
#
# Alternative if ^J200.JO proves flaky: the Satrix 40 ETF "STX40.JO" (cents, tracks the Top 40,
# NOT verified). Swap the symbol and set divisor = 100, prefix = "R", decimals = 2.

[[markets.instruments]]
label = "JSE Top 40"
symbol = "^J200.JO"
market = "JSE"
prefix = ""
decimals = 0

[[markets.instruments]]
label = "Standard Bank"
symbol = "SBK.JO"
market = "JSE"
prefix = "R"
decimals = 2
divisor = 100

[[markets.instruments]]
label = "FirstRand"
symbol = "FSR.JO"
market = "JSE"
prefix = "R"
decimals = 2
divisor = 100

[[markets.instruments]]
label = "Absa"
symbol = "ABG.JO"
market = "JSE"
prefix = "R"
decimals = 2
divisor = 100

[[markets.instruments]]
label = "Nedbank"
symbol = "NED.JO"
market = "JSE"
prefix = "R"
decimals = 2
divisor = 100

# CPI.JO = Capitec ordinary shares. (CPIP.JO is the preference share, not what you want.)
[[markets.instruments]]
label = "Capitec"
symbol = "CPI.JO"
market = "JSE"
prefix = "R"
decimals = 2
divisor = 100

[[markets.instruments]]
label = "Brent"
symbol = "BZ=F"
market = "24H"
prefix = "$"
decimals = 2

# GC=F is the COMEX front-month gold future in USD per troy ounce.
[[markets.instruments]]
label = "Gold"
symbol = "GC=F"
market = "24H"
prefix = "$"
decimals = 0


# ---------------------------------------------------------------------------------------------
# YouTube: public stats via the YouTube Data API v3 (API key in the YOUTUBE_API_KEY secret).
# Channel IDs start with "UC" (24 characters). To find one: open the channel -> About ->
# Share channel -> Copy channel ID. An @handle will NOT work.
# `name` is optional; if omitted, the channel's own title is used.
# Public subscriber counts are rounded by YouTube (3 significant figures).
[youtube]
enabled = true
source = "data_api"                        # later: "supabase" once the Command Centre exists
state_file = "data/youtube_history.json"   # committed by the workflow; enables day-over-day change
history_days = 120

# [[youtube.channels]]
# name = "My first channel"
# id = "UCxxxxxxxxxxxxxxxxxxxxxx"
#
# [[youtube.channels]]
# name = "My second channel"
# id = "UCxxxxxxxxxxxxxxxxxxxxxx"

# ---------------------------------------------------------------------------------------------
# SA economy headlines from RSS. Headline + link only; article text is never used or shown.
# STATUS OF THESE FEEDS: the URLs below come from web searches and were NOT fetched from the
# build sandbox (SA news hosts are blocked there). Run the workflow with "Dry run" ticked and read
# the log: each feed prints `feed=<name> ok items=N newest=...` or `FAILED <reason>`.
[headlines]
enabled = true
max_items = 4              # 3-5 recommended
max_per_source = 2         # so one outlet can't fill the list
max_age_hours = 48         # ignore older items (items without a date are kept)
similarity = 0.5           # 0-1: how alike two headlines must be to count as the same story
user_agent = "Mozilla/5.0 (compatible; SA-Morning-Brief/1.0)"

# Items matching more of these (title counts triple vs summary) rank higher.
# "load shedding" also matches "load-shedding"; a trailing "s" is allowed automatically.
keywords = [
  "repo rate", "interest rate", "reserve bank", "sarb", "mpc",
  "inflation", "cpi", "consumer price",
  "fuel price", "petrol", "diesel",
  "rand", "unemployment", "bank", "budget",
  "load shedding", "loadshedding",
]

# Phrases that contain a keyword but don't mean it, ignored when matching (e.g. "East Rand" is a
# place, not the currency). Add more as you spot them.
exclude_phrases = ["east rand", "west rand", "rand water", "rand daily mail", "rand afrikaans"]

# priority: added to every item's score.  keyword_only: general-interest feed, so only items with a
# keyword in the TITLE are eligible.  user_agent: per-feed override for sites that block the default.
# enabled = false: kept for reference, not fetched.
[[headlines.feeds]]
name = "Moneyweb"
url = "https://www.moneyweb.co.za/feed/"

[[headlines.feeds]]
name = "Daily Maverick"
url = "https://www.dailymaverick.co.za/dmrss/"
keyword_only = true

# Verified working from GitHub's runners in a live dry run (29 Sep 2026).
[[headlines.feeds]]
name = "The Citizen"
url = "https://www.citizen.co.za/business/feed/"
keyword_only = true

# Google News search (Reserve Bank / rates / SA economy): stands in for the missing SARB feed, since
# it picks up Reserve Bank stories from many outlets. Links go via news.google.com (they redirect to
# the article). The "- Publisher" suffix is moved into the source label.
[[headlines.feeds]]
name = "Google News"
url = "https://news.google.com/rss/search?q=South+Africa+economy+OR+%22Reserve+Bank%22+OR+%22repo+rate%22+when:2d&hl=en-ZA&gl=ZA&ceid=ZA:en"
keyword_only = true
split_publisher = true

# Tried and blocked (HTTP 403 from GitHub's runners, even with a browser User-Agent):
# BusinessTech (https://businesstech.co.za/news/feed/), Daily Investor, MyBroadband.

# Business Day publishes a list of its feeds at https://www.businessday.co.za/information/rss-feeds/
# Open it, copy the Economy (or Business) feed address here, and set enabled = true.
[[headlines.feeds]]
name = "Business Day"
url = "https://www.businessday.co.za/information/rss-feeds/"   # <- placeholder: replace with the feed URL
enabled = false

# SARB: NO FEED URL COULD BE CONFIRMED. If you find one on https://www.resbank.co.za, add it here
# with priority = 3 so SARB releases outrank other news.
# [[headlines.feeds]]
# name = "SARB"
# url = "..."
# priority = 3

# ---------------------------------------------------------------------------------------------
# "Watch today": known scheduled events, kept in their own file so it's easy to maintain.
[watch]
enabled = true
file = "config/events.toml"

# ---------------------------------------------------------------------------------------------
# OPTIONAL, OFF BY DEFAULT: a one-sentence summary above the headlines, written by Claude.
# This is the ONLY paid feature (a few cents a month; needs an ANTHROPIC_API_KEY secret and your
# own Anthropic API credit; it is not covered by any free tier). Only headline titles are sent.
# Any failure just omits the sentence.
[summary]
enabled = false
model = "claude-opus-5-5"      # any Claude model ID works; a smaller one is cheaper

# ---------------------------------------------------------------------------------------------
# AI updates: replaces the markets block. Same engine and options as [headlines] above.
# Dedicated AI feeds need no keyword filter; general tech feeds use keyword_only.
# TRIAL FEEDS: URLs are unverified guesses until a dry run shows which respond from GitHub's
# runners; failures are removed afterwards. Anthropic has no official RSS feed.
[ai_news]
enabled = true
max_items = 5
max_per_source = 2
max_age_hours = 72
similarity = 0.5
user_agent = "Mozilla/5.0 (compatible; SA-Morning-Brief/1.0)"
keywords = [
  "AI", "artificial intelligence", "LLM", "large language model", "generative",
  "OpenAI", "Anthropic", "Claude", "Gemini", "GPT", "ChatGPT", "DeepMind", "Mistral", "Llama",
  "machine learning", "Nvidia", "AI agent",
]
exclude_phrases = []

[[ai_news.feeds]]
name = "OpenAI"
url = "https://openai.com/news/rss.xml"

[[ai_news.feeds]]
name = "Google AI"
url = "https://blog.google/technology/ai/rss/"

[[ai_news.feeds]]
name = "Hugging Face"
url = "https://huggingface.co/blog/feed.xml"

[[ai_news.feeds]]
name = "MIT Technology Review"
url = "https://www.technologyreview.com/topic/artificial-intelligence/feed"

[[ai_news.feeds]]
