url = "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"

[[ai_news.feeds]]
name = "TechCrunch"
url = "https://techcrunch.com/category/artificial-intelligence/feed/"

[[ai_news.feeds]]
name = "Ars Technica"
url = "https://feeds.arstechnica.com/arstechnica/technology-lab"
keyword_only = true

[[ai_news.feeds]]
name = "Hacker News"
url = "https://hnrss.org/newest?q=AI+OR+LLM+OR+OpenAI+OR+Anthropic&points=150"

[[ai_news.feeds]]
