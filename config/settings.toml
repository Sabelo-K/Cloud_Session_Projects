# SA Morning Brief settings. Edit freely; every section is optional via `enabled`.

[brief]
# Soft cap on message length. If the message is longer, blank separator lines are dropped.
max_lines = 30

[weather]
enabled = true
name = "Durban"
latitude = -29.86
longitude = 31.03
timezone = "Africa/Johannesburg"
base_url = "https://api.open-meteo.com/v1/forecast"   # Open-Meteo, no API key

[fx]
enabled = true
# Frankfurter serves ECB reference rates, published once per business day (~16:00 CET).
# If this host ever moves, the older https://api.frankfurter.app is the same service.
base_url = "https://api.frankfurter.dev/v1"
quote = "ZAR"
bases = ["USD", "EUR", "GBP"]   # shown as USD/ZAR, EUR/ZAR, GBP/ZAR

[markets]
enabled = true
# Extra dates (YYYY-MM-DD) the JSE was closed that the `holidays` package doesn't know about,
# e.g. a one-off declared holiday. Weekends and ZA public holidays are already handled.
extra_jse_closed_dates = []

# market = "JSE"  -> uses the JSE session calendar (weekdays minus ZA public holidays)
# market = "24H"  -> futures; weekdays only
# divisor = 100   -> Yahoo quotes JSE equities in cents (ZAc); this shows Rand
#
# Alternative if ^J200.JO proves flaky: the Satrix 40 ETF "STX40.JO" (cents, tracks the Top 40,
# NOT verified). Swap the symbol and set divisor = 100, prefix = "R", decimals = 2.

[[markets.instruments]]
label = "JSE Top 40"
symbol = "^J200.JO"
market = "JSE"
prefix = ""
decimals = 0

[[markets.instruments]]
label = "Standard Bank"
symbol = "SBK.JO"
market = "JSE"
prefix = "R"
decimals = 2
divisor = 100

[[markets.instruments]]
label = "FirstRand"
symbol = "FSR.JO"
market = "JSE"
prefix = "R"
decimals = 2
divisor = 100

[[markets.instruments]]
label = "Absa"
symbol = "ABG.JO"
market = "JSE"
prefix = "R"
decimals = 2
divisor = 100

[[markets.instruments]]
label = "Nedbank"
symbol = "NED.JO"
market = "JSE"
prefix = "R"
decimals = 2
divisor = 100

# CPI.JO = Capitec ordinary shares. (CPIP.JO is the preference share, not what you want.)
[[markets.instruments]]
label = "Capitec"
symbol = "CPI.JO"
market = "JSE"
prefix = "R"
decimals = 2
divisor = 100

[[markets.instruments]]
label = "Brent"
symbol = "BZ=F"
market = "24H"
prefix = "$"
decimals = 2

# GC=F is the COMEX front-month gold future in USD per troy ounce.
[[markets.instruments]]
label = "Gold"
symbol = "GC=F"
market = "24H"
prefix = "$"
decimals = 0


# ---------------------------------------------------------------------------------------------
# YouTube: public stats via the YouTube Data API v3 (API key in the YOUTUBE_API_KEY secret).
# Channel IDs start with "UC" (24 characters). To find one: open the channel -> About ->
# Share channel -> Copy channel ID. An @handle will NOT work.
# `name` is optional; if omitted, the channel's own title is used.
# Public subscriber counts are rounded by YouTube (3 significant figures).
[youtube]
enabled = true
source = "data_api"                        # later: "supabase" once the Command Centre exists
state_file = "data/youtube_history.json"   # committed by the workflow; enables day-over-day change
history_days = 120

# [[youtube.channels]]
# name = "My first channel"
# id = "UCxxxxxxxxxxxxxxxxxxxxxx"
#
# [[youtube.channels]]
# name = "My second channel"
# id = "UCxxxxxxxxxxxxxxxxxxxxxx"

# ---------------------------------------------------------------------------------------------
# SA economy headlines from RSS. Headline + link only; article text is never used or shown.
# STATUS OF THESE FEEDS: the URLs below come from web searches and were NOT fetched from the
# build sandbox (SA news hosts are blocked there). Run the workflow with "Dry run" ticked and read
# the log: each feed prints `feed=<name> ok items=N newest=...` or `FAILED <reason>`.
[headlines]
enabled = true
max_items = 4              # 3-5 recommended
max_per_source = 2         # so one outlet can't fill the list
max_age_hours = 48         # ignore older items (items without a date are kept)
similarity = 0.5           # 0-1: how alike two headlines must be to count as the same story
user_agent = "Mozilla/5.0 (compatible; SA-Morning-Brief/1.0)"

# Items matching more of these (title counts triple vs summary) rank higher.
# "load shedding" also matches "load-shedding"; a trailing "s" is allowed automatically.
keywords = [
  "repo rate", "interest rate", "reserve bank", "sarb", "mpc",
  "inflation", "cpi", "consumer price",
  "fuel price", "petrol", "diesel",
  "rand", "unemployment", "bank", "budget",
  "load shedding", "loadshedding",
]

# priority: added to every item's score.  keyword_only: general-interest feed, so only items that
# match a keyword are eligible.  enabled = false: kept for reference, not fetched.
[[headlines.feeds]]
name = "Moneyweb"
url = "https://www.moneyweb.co.za/feed/"

[[headlines.feeds]]
name = "BusinessTech"
url = "https://businesstech.co.za/news/feed/"

[[headlines.feeds]]
name = "Daily Maverick"
url = "https://www.dailymaverick.co.za/dmrss/"
keyword_only = true

# Business Day publishes a list of its feeds at https://www.businessday.co.za/information/rss-feeds/
# Open it, copy the Economy (or Business) feed address here, and set enabled = true.
[[headlines.feeds]]
name = "Business Day"
url = "https://www.businessday.co.za/information/rss-feeds/"   # <- placeholder: replace with the feed URL
enabled = false

# SARB: NO FEED URL COULD BE CONFIRMED. If you find one on https://www.resbank.co.za, add it here
# with priority = 3 so SARB releases outrank other news.
# [[headlines.feeds]]
# name = "SARB"
# url = "..."
# priority = 3

# ---------------------------------------------------------------------------------------------
# "Watch today": known scheduled events, kept in their own file so it's easy to maintain.
[watch]
enabled = true
file = "config/events.toml"
